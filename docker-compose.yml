services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Kolkata
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # no built-in defaults for secrets: copy .env.example to .env and set real values
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (see .env.example)}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      # the address at which people reach this portal; stamped into sign-in tokens and
      # discovery documents, so it must be the public one when deployed
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  citizen-mcp:
    build: ./app
    command: ["uvicorn", "citizen_mcp:asgi_app", "--host", "0.0.0.0", "--port", "8100", "--workers", "1"]
    ports:
      - "8100:8100"
    environment:
      TZ: Asia/Kolkata
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_ISSUER: ${PUBLIC_BASE_URL:-http://localhost:8000}
      # Set this to the exact public MCP resource URL in production. OAuth audience
      # validation intentionally fails if the client requests a different resource.
      CITIZEN_MCP_PUBLIC_URL: ${CITIZEN_MCP_PUBLIC_URL:-http://localhost:8100/mcp}
    depends_on:
      - db
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./app
    environment:
      TZ: Asia/Kolkata
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the Docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
