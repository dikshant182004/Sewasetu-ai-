name: Citizen and Officer MCP tests

on:
  push:
    branches: ["fix/portal-hardening"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements.txt
      - name: Install application and MCP dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r app/requirements.txt
      - name: Validate Docker Compose configuration
        env:
          ADMIN_PASSWORD: ci-only-password
          SECRET_KEY: ci-test-only
        run: docker compose config --quiet
      - name: Run unit tests
        env:
          SECRET_KEY: ci-test-only
        run: python -m unittest discover -s tests -v
